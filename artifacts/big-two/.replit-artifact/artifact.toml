kind = "mobile"
previewPath = "/"
title = "Big Two"
description = "A mobile Big Two card game where you play complete four-player matches against three computer opponents, with standard rules, helpful turn guidance, and saved match preferences."
version = "1.0.0"
id = "artifacts/big-two"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20058

[services.development]
run = "pnpm --filter @workspace/big-two run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/big-two", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/big-two", "run", "serve" ]

[services.env]
PORT = "20058"
BASE_PATH = "/"
